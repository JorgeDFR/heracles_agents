metadata:
  note: "Use a Hugging Face-compatible model server for the Cypher generation phase."
configurations:

    feedforward-cypher-qa-hf-lora:
        dsg_interface:
            dsg_interface_type: heracles
            uri: neo4j://$ADT4_HERACLES_IP:$ADT4_HERACLES_PORT

        pipeline: feedforward_cypher
        phases:
            generate-cypher:
                client:
                    client_type: huggingface
                    host: http://huggingface:8000
                    max_new_tokens: 512

                model_info:
                    model: gemma-4-E2B-it-3dsg-text2cypher-lora
                    temperature: 0.2
                    seed: 123

                agent_info:
                    prompt_settings:
                        base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/cypher/qa_feedforward_cypher_prompt.yaml
                    tools: []
                    tool_interface: none
                    max_iterations: 1

            refine:
                client:
                    client_type: openrouter

                model_info:
                    model: google/gemma-4-26b-a4b-it
                    temperature: 0.2
                    seed: 123

                agent_info:
                    prompt_settings:
                        base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/cypher/qa_feedforward_refinement_cypher_prompt.yaml
                        output_type: SLDP
                        answer_type_hint: true
                    tools: []
                    tool_interface: none
                    max_iterations: 1

        questions: $HERACLES_AGENTS_PATH/examples/questions/qa_questions.yaml
