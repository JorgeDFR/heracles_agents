metadata:
  note: "Use a Hugging Face-compatible model server as a single tool-using Cypher QA agent."
configurations:

    agentic-cypher-qa-hf-lora:
        dsg_interface:
            dsg_interface_type: none

        pipeline: agentic
        phases:
            main:
                client:
                    client_type: huggingface
                    host: http://huggingface:8000
                    max_new_tokens: 512

                model_info:
                    model: gemma-4-E2B-it-3dsg-text2cypher-lora
                    temperature: 0.2
                    seed: 123

                agent_info:
                    prompt_settings:
                        base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/custom_tool_call/qa_agentic_cypher_prompt.yaml
                        output_type: SLDP
                        answer_type_hint: true
                    tools:
                        - name: run_cypher_query
                          bound_args:
                              dsgdb_conf:
                                  dsg_interface_type: heracles
                                  uri: neo4j://$ADT4_HERACLES_IP:$ADT4_HERACLES_PORT
                    tool_interface: custom
                    max_iterations: 5

        questions: $HERACLES_AGENTS_PATH/examples/questions/qa_questions.yaml
