metadata:
  local_metrics:
    enabled: true
    target_provider: ollama
    ollama_container_name: ollama
    docker_host: tcp://docker-socket-proxy:2375
    ollama_host: http://ollama:11434
    sample_interval_seconds: 0.025
    gpu_baseline_seconds: 5
    unload_models_before_baseline: true
    baseline_adjust_gpu: true

configurations:

    canary:
        dsg_interface:
            dsg_interface_type: none

        pipeline: canary
        phases:
            main:
                client:
                    client_type: ollama

                model_info:
                    model: gemma4:26b
                    temperature: 0.2
                    seed: 123

                agent_info:
                    prompt_settings:
                        base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/canary_prompt.yaml
                        output_type: SLDP
                        answer_type_hint: true
                    tools:
                        - name: calculator
                        - name: ask_favog
                    tool_interface: ollama
                    max_iterations: 5

        questions: $HERACLES_AGENTS_PATH/examples/questions/canary_questions.yaml
