metadata:
  benchmark_family: ollama_model_sweep
  task: pddl
  local_metrics:
    enabled: true
    target_provider: ollama
    ollama_container_name: ollama
    docker_host: tcp://docker-socket-proxy:2375
    ollama_host: http://ollama:11434
    sample_interval_seconds: 0.1
    gpu_baseline_seconds: 5
    unload_models_before_baseline: true
    baseline_adjust_gpu: true
    warmup_enabled: true
    warmup_keep_alive: -1
    warmup_verify_resident: true

model_sweeps:
  ollama-pddl:
    provider: ollama
    phase: main
    configuration_name_template: agentic-cypher-pddl-{alias}
    result_configuration_name: agentic-cypher-pddl
    models_path: $HERACLES_AGENTS_PATH/examples/experiments/ollama/model_lists/example.yaml
    template:
      dsg_interface:
        dsg_interface_type: none

      pipeline: agentic
      phases:
        main:
          client:
            client_type: ollama
            keep_alive: -1
          model_info:
            temperature: 0.2
            seed: 123
          agent_info:
            prompt_settings:
              base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/cypher/pddl_agentic_cypher_prompt.yaml
              output_type: PDDL
            tools:
              - name: run_cypher_query
                bound_args:
                  dsgdb_conf:
                    dsg_interface_type: heracles
                    uri: $HERACLES_NEO4J_URI
            tool_interface: ollama
            max_iterations: 5

      questions: $HERACLES_AGENTS_PATH/examples/questions/pddl_questions.yaml

configurations: {}
