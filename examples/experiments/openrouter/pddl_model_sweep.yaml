metadata:
  benchmark_family: openrouter_model_sweep
  task: pddl

model_sweeps:
  openrouter-pddl:
    provider: openrouter
    phase: main
    configuration_name_template: agentic-cypher-pddl-{alias}
    models_path: $HERACLES_AGENTS_PATH/examples/experiments/openrouter/model_lists/research_11.yaml
    template:
      dsg_interface:
        dsg_interface_type: none

      pipeline: agentic
      phases:
        main:
          client:
            client_type: openrouter
          model_info:
            temperature: 0.2
            seed: 123
          agent_info:
            prompt_settings:
              base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/cypher/pddl_agentic_cypher_prompt.yaml
              output_type: PDDL
            tools:
              - name: run_cypher_query
                bound_args:
                  dsgdb_conf:
                    dsg_interface_type: heracles
                    uri: $HERACLES_NEO4J_URI
            tool_interface: openrouter
            max_iterations: 5

      questions: $HERACLES_AGENTS_PATH/examples/questions/pddl_questions.yaml

configurations: {}
