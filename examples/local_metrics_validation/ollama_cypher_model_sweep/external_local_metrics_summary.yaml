measurement_notes:
- Docker CPU percentages require at least two container stats samples.
- The requested sampling interval may not be achievable because Docker stats and nvidia-smi
  calls have nontrivial overhead.
- RAM uses the Ollama container process RSS from Docker top when available. Cgroup
  working-set and cgroup usage-including-cache fields are retained because memory-mapped
  model files can otherwise make Docker memory accounting misleading.
- Ollama response runtime/token metrics cannot be independently sampled externally;
  compare them from pipeline result/debug files instead.
